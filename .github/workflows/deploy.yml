name: Deploy to Cloud Run

on:
  push:
    branches: [master]

# Required repo configuration before this runs (Settings → Secrets and variables → Actions):
#
# Variables (Settings → Variables):
#   GCP_PROJECT_ID           e.g. easy-point-prod
#   GCP_REGION                e.g. us-central1
#   GCP_SERVICE                Cloud Run service name, e.g. easy-point-ui
#   GCP_ARTIFACT_REPO          Artifact Registry repo name, e.g. easy-point
#   GCP_WORKLOAD_IDENTITY_PROVIDER   full resource name of the WIF provider
#   GCP_SERVICE_ACCOUNT               deployer service account email
#
# No long-lived service-account key is stored in GitHub — auth is via
# Workload Identity Federation (see google-github-actions/auth docs for the
# one-time `gcloud iam workload-identity-pools` setup).
#
# BACKEND_API_URL / OTP_REQUEST_PATH are NOT set here — configure them once
# on the Cloud Run service itself so they persist across deploys.

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build and push image
        env:
          IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_ARTIFACT_REPO }}/${{ vars.GCP_SERVICE }}
        run: |
          docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" .
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ vars.GCP_SERVICE }}
          region: ${{ vars.GCP_REGION }}
          image: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_ARTIFACT_REPO }}/${{ vars.GCP_SERVICE }}:${{ github.sha }}
